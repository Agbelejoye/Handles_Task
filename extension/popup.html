<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Handler AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0B0B0B;
      color: #fff;
      width: 280px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px; height: 28px;
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .title { font-weight: 700; font-size: 14px; }
    .title span { color: #D4AF37; }
    .card {
      background: rgba(26,26,26,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .label { font-size: 12px; color: rgba(255,255,255,0.6); }
    .value { font-size: 12px; color: #fff; font-weight: 500; }
    .toggle {
      position: relative; width: 38px; height: 20px;
      background: rgba(255,255,255,0.1); border-radius: 10px;
      cursor: pointer; transition: background 0.2s;
      border: none; outline: none;
    }
    .toggle.on { background: #D4AF37; }
    .toggle-thumb {
      position: absolute; top: 2px;
      width: 16px; height: 16px;
      background: white; border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle .toggle-thumb { left: 2px; }
    .toggle.on .toggle-thumb { left: 20px; }
    .btn {
      width: 100%; padding: 8px;
      background: #D4AF37; color: #000;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #E8C84A; }
    .btn.secondary {
      background: transparent; color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1); margin-top: 6px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block; margin-right: 4px;
    }
    .status-dot.on { background: #4ade80; }
    .status-dot.off { background: rgba(255,255,255,0.2); }
    .api-input {
      width: 100%; padding: 6px 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; color: #fff; font-size: 11px; margin-top: 6px;
    }
    .privacy-note {
      font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 8px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div class="title">Task Handler <span>AI</span></div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">
        <span class="status-dot" id="status-dot"></span>
        Activity tracking
      </span>
      <button class="toggle" id="toggle-btn">
        <div class="toggle-thumb"></div>
      </button>
    </div>
    <div class="row">
      <span class="label">Active tab</span>
      <span class="value" id="active-tab">–</span>
    </div>
    <div class="row">
      <span class="label">Buffer</span>
      <span class="value" id="buffer-size">0 events</span>
    </div>
  </div>

  <button class="btn" id="sync-btn">Sync Now</button>
  <button class="btn secondary" id="open-app">Open Dashboard ↗</button>

  <div class="card" style="margin-top:10px">
    <div class="label" style="margin-bottom:6px">API Base URL</div>
    <input type="text" id="api-input" class="api-input" placeholder="http://localhost:3000" />
  </div>

  <p class="privacy-note">
    🔒 Activity tracking is opt-in and only active when enabled above.
    Data is sent to your local Task Handler AI instance only.
  </p>

  <script src="popup.js"></script>
</body>
</html>
